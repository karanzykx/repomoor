[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "repomoor"
version = "0.1.0"
description = "Project-local, non-destructive advisor for AI coding tooling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Karan Pandya"}]
keywords = ["ai-coding", "claude-code", "cursor", "repository", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/karanzykx/repomoor"
Issues = "https://github.com/karanzykx/repomoor/issues"
Changelog = "https://github.com/karanzykx/repomoor/blob/main/CHANGELOG.md"

[project.scripts]
repomoor = "repomoor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repomoor = ["data/*.json"]
