name: Offline CLI tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test standard-library CLI
        run: python -m unittest discover -s tests -v
      - name: Check bundled catalog parses
        run: python repomoor.py --catalog --json
      - name: Check CLI help
        run: python repomoor.py --help
